name: Publish Maven package
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact mod_version to publish from main
        required: true
        type: string
permissions:
  contents: read
  packages: write
concurrency:
  group: homecore-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check requested version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: test "$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')" = "$REQUESTED_VERSION"
      - name: Build and verify
        run: bash gradlew build test verifyReleaseJar --no-daemon
      - name: GameTests write
        run: bash gradlew runPersistence -PpersistencePass=write --no-daemon --no-configuration-cache
      - name: GameTests read
        run: bash gradlew runPersistence -PpersistencePass=read --no-daemon --no-configuration-cache
      - name: Stage Maven publication
        run: bash gradlew publishMavenJavaPublicationToStagingRepository --no-daemon
      - name: Resolve Maven publication in an independent consumer
        run: bash gradlew -p gradle/publication-smoke verifyPublishedArtifacts --no-daemon --no-configuration-cache
      - name: Publish
        run: bash gradlew publishMavenJavaPublicationToGitHubPackagesRepository --no-daemon --no-configuration-cache
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
