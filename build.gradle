plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'net.darkhax.curseforgegradle' version '1.1.28'
}

version = mod_version
group = mod_group_id

repositories {
    mavenCentral()
    maven { url = 'https://maven.blamejared.com/'; content { includeGroup 'mezz.jei'; includeGroup 'net.mezzdev.config' } }
    maven { url = 'https://maven.shedaniel.me/'; content { includeGroup 'me.shedaniel'; includeGroup 'me.shedaniel.cloth' } }
    maven { url = 'https://maven.architectury.dev/'; content { includeGroup 'dev.architectury' } }
    maven { url = 'https://maven.fabricmc.net/'; content { includeGroup 'net.fabricmc' } }
}

// JEI and REI are optional client integrations: compiled against their APIs, never embedded or required.
// Pass -PwithJei or -PwithRei to load one of them in development runs.
def withJei = providers.gradleProperty('withJei').isPresent()
def withRei = providers.gradleProperty('withRei').isPresent()
dependencies {
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    compileOnly "me.shedaniel:RoughlyEnoughItems-api-neoforge:${rei_version}"
    // Information pages use REI's built-in display type, shipped in the full REI artifact.
    compileOnly("me.shedaniel:RoughlyEnoughItems-neoforge:${rei_version}") { transitive = false }
    // REI annotates its API with net.fabricmc.api.Environment; only that annotation type is needed to compile.
    compileOnly("net.fabricmc:fabric-loader:0.16.14") { transitive = false }
    if (withJei) runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    if (withRei) runtimeOnly "me.shedaniel:RoughlyEnoughItems-neoforge:${rei_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    systemProperty 'homecore.mainClasses', sourceSets.main.output.classesDirs.singleFile.absolutePath
    testLogging { events 'failed', 'skipped' }
}

// Verification fixtures are compiled only for dedicated validation runs and are
// never included in the distributable mod or its sources archive.
sourceSets {
    test {
        // Compile the standalone SDK example inside NeoForge's transformed test harness.
        java.srcDir 'src/examples/java'
    }
    verification {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    examples {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    development {
        compileClasspath += sourceSets.main.output + sourceSets.examples.output
        runtimeClasspath += sourceSets.main.output + sourceSets.examples.output
    }
}
configurations {
    verificationImplementation.extendsFrom implementation
    verificationRuntimeOnly.extendsFrom runtimeOnly
    examplesImplementation.extendsFrom implementation
    examplesRuntimeOnly.extendsFrom runtimeOnly
    developmentImplementation.extendsFrom implementation
    developmentRuntimeOnly.extendsFrom runtimeOnly
}

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
    withJavadocJar()
}

tasks.named('javadoc', Javadoc) {
    source = sourceSets.main.allJava.matching { include 'fr/lkdm/homecore/api/**' }
    classpath += sourceSets.main.output
    options.encoding = 'UTF-8'
    options.addBooleanOption('Xdoclint:all', true)
    options.addBooleanOption('Werror', true)
}

tasks.named('check') {
    dependsOn tasks.named('examplesClasses'), tasks.named('developmentClasses'), tasks.named('verificationClasses')
}

tasks.withType(Jar).configureEach {
    from('LICENSE') { into 'META-INF' }
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

def releaseJarFile = tasks.named('jar', Jar).flatMap { it.archiveFile }
def releaseVersion = providers.gradleProperty('mod_version').get()
def curseForgePublishRequested = gradle.startParameter.taskNames.any {
    it == 'publishHomeCoreToCurseForge' || it.endsWith(':publishHomeCoreToCurseForge')
}
def curseForgeToken = curseForgePublishRequested
        ? providers.gradleProperty('curseforge_api_token')
                .orElse(providers.environmentVariable('CURSEFORGE_API_TOKEN')).getOrNull()
        : null
if (curseForgePublishRequested && !curseForgeToken?.trim()) {
    throw new GradleException('Set curseforge_api_token in your user Gradle properties or CURSEFORGE_API_TOKEN in the environment.')
}

tasks.register('publishHomeCoreToCurseForge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    group = 'publishing'
    description = 'Builds and uploads the HomeCore release JAR to CurseForge project 1711592.'
    dependsOn tasks.named('check')
    notCompatibleWithConfigurationCache('The CurseForge upload reads its API token only when publishing.')

    // Publishing is excluded from the configuration cache so the API token is never cached.
    apiToken = curseForgeToken

    def mainFile = upload(1711592, tasks.named('jar'))
    mainFile.displayName = "HomeCore ${releaseVersion}"
    mainFile.changelog = "HomeCore ${releaseVersion} for Minecraft ${minecraft_version} and NeoForge ${neo_version}."
    mainFile.changelogType = 'markdown'
    mainFile.releaseType = 'release'
    mainFile.addEnvironment('Client', 'Server')
    mainFile.addModLoader('NeoForge')
}

def verifyReleaseJar = tasks.register('verifyReleaseJar') {
    group = 'verification'
    description = 'Checks release identity and exclusion of development/test code.'
    dependsOn tasks.named('jar')
    inputs.file(releaseJarFile)
    doLast {
        def archive = new java.util.zip.ZipFile(releaseJarFile.get().asFile)
        try {
            def names = archive.entries().collect { it.name }
            def forbidden = ['fr/lkdm/homecore/development/', 'fr/lkdm/homecore/example/',
                             'fr/lkdm/homecore/verification/', 'org/junit/']
            if (names.any { name -> forbidden.any { prefix -> name.startsWith(prefix) } }) {
                throw new GradleException('Development or test classes found in release JAR.')
            }
            for (def entry : ['fr/lkdm/homecore/HomeCore.class', 'fr/lkdm/homecore/api/DashboardAPI.class',
                             'fr/lkdm/homecore/api/client/ui/HomeLinkTheme.class',
                             'fr/lkdm/homecore/api/client/ui/HomeLinkUi.class',
                             'fr/lkdm/homecore/api/client/ui/HomeLinkButton.class',
                             'fr/lkdm/homecore/api/client/ui/HomeLinkScreenLayout.class',
                             'fr/lkdm/homecore/api/client/ui/HomeLinkStatusTone.class',
                             'fr/lkdm/homecore/api/item/ItemPort.class',
                             'fr/lkdm/homecore/api/item/ItemPortType.class',
                             'fr/lkdm/homecore/api/item/ItemApi.class',
                             'fr/lkdm/homecore/item/HomeLinkConnectorItem.class',
                             'assets/homecore/models/item/homelink_connector.json',
                             'data/homecore/recipe/homelink_connector.json',
                             'fr/lkdm/homecore/registry/HomeCoreItems.class',
                             'fr/lkdm/homecore/registry/HomeCoreCreativeTabs.class',
                             'assets/homecore/models/item/homelink_circuit_board.json',
                             'assets/homecore/models/item/homelink_microprocessor.json',
                             'assets/homecore/models/item/homelink_communication_module.json',
                             'assets/homecore/models/item/homelink_control_module.json',
                             'assets/homecore/textures/item/homelink_circuit_board.png',
                             'assets/homecore/textures/item/homelink_microprocessor.png',
                             'assets/homecore/textures/item/homelink_communication_module.png',
                             'assets/homecore/textures/item/homelink_control_module.png',
                             'assets/homecore/textures/item/homelink_model_palette.png',
                             'assets/homecore/lang/en_us.json', 'assets/homecore/lang/fr_fr.json',
                             'data/homecore/recipe/homelink_circuit_board.json',
                             'data/homecore/recipe/homelink_microprocessor.json',
                             'data/homecore/recipe/homelink_communication_module.json',
                             'data/homecore/recipe/homelink_control_module.json',
                             'fr/lkdm/homecore/workbench/ElectronicsBlockEntity.class',
                             'fr/lkdm/homecore/workbench/client/ElectronicsScreen.class',
                             'fr/lkdm/homecore/workbench/recipe/ElectronicsRecipe.class',
                             'fr/lkdm/homecore/compat/jei/ElectronicsJeiPlugin.class',
                             'fr/lkdm/homecore/compat/rei/ElectronicsReiPlugin.class',
                             'assets/homecore/blockstates/electronics_workbench.json',
                             'assets/homecore/models/item/electronics_workbench.json',
                             'assets/homecore/models/block/electronics_workbench.json',
                             'assets/homecore/models/block/electronics_workbench_left.json',
                             'assets/homecore/models/block/electronics_workbench_right.json',
                             'data/homecore/recipe/electronics_workbench.json',
                             'data/homecore/loot_table/blocks/electronics_workbench.json',
                             'data/homecore/advancement/recipes/decorations/electronics_workbench.json',
                             'assets/homecore/textures/block/device_steel.png',
                             'assets/homecore/textures/block/device_steel_dark.png',
                             'META-INF/NOTICE', 'META-INF/neoforge.mods.toml', 'META-INF/LICENSE']) {
                if (!names.contains(entry)) throw new GradleException("Missing release entry: ${entry}")
            }
            def metadata = archive.getInputStream(archive.getEntry('META-INF/neoforge.mods.toml')).withCloseable { it.getText('UTF-8') }
            if (!metadata.contains('modId = "homecore"') || !metadata.contains("version = \"${releaseVersion}\"")
                    || metadata.contains('homecore_debug') || metadata.contains('homecore_validation')) {
                throw new GradleException('Incorrect release metadata.')
            }
            logger.lifecycle("Release JAR verified: HomeCore ${releaseVersion}; development and test code excluded.")
        } finally {
            archive.close()
        }
    }
}
tasks.named('check') { dependsOn verifyReleaseJar }

def apiVersionSource = layout.projectDirectory.file('src/main/java/fr/lkdm/homecore/api/DashboardAPI.java')
def releaseReadmes = files('README.md', 'README.en.md')
def verifyDocumentation = tasks.register('verifyDocumentation') {
    group = 'verification'
    description = 'Checks current README release coordinates and API version against the source of truth.'
    inputs.files(releaseReadmes)
    inputs.file(apiVersionSource)
    inputs.property('releaseVersion', releaseVersion)
    doLast {
        def apiMatch = apiVersionSource.asFile.getText('UTF-8') =~ /API_VERSION\s*=\s*"([^"]+)"/
        if (!apiMatch.find()) throw new GradleException('DashboardAPI.API_VERSION was not found.')
        def apiVersion = apiMatch.group(1)
        releaseReadmes.files.each { readme ->
            def content = readme.getText('UTF-8')
            if (!content.readLines().first().equals('# HomeCore ' + releaseVersion)) {
                throw new GradleException("${readme.name}: release heading differs from mod_version.")
            }
            def documentedApi = content =~ /DashboardAPI\.API_VERSION\s*=\s*"([^"]+)"/
            if (!documentedApi.find()) throw new GradleException("${readme.name}: missing API version.")
            documentedApi.reset()
            while (documentedApi.find()) {
                if (documentedApi.group(1) != apiVersion) {
                    throw new GradleException("${readme.name}: API version differs from DashboardAPI.")
                }
            }
            for (def pattern : [/fr\.lkdm\.homecore:homecore:([0-9.]+)/, /homecore-([0-9.]+)\.jar/,
                                /versionRange="\[([0-9.]+),2\.0\.0\)"/]) {
                def matches = content =~ pattern
                if (!matches.find()) throw new GradleException("${readme.name}: missing release example matching ${pattern}.")
                matches.reset()
                while (matches.find()) {
                    if (matches.group(1) != releaseVersion) {
                        throw new GradleException("${readme.name}: outdated release example ${matches.group()}.")
                    }
                }
            }
        }
        logger.lifecycle('README release and API versions verified: {} / {}', releaseVersion, apiVersion)
    }
}
tasks.named('check') { dependsOn verifyDocumentation }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs.addAll(['-Xlint:deprecation', '-Xlint:removal', '-Xlint:unchecked', '-Werror'])
}

neoForge {
    version = project.neo_version
    addModdingDependenciesTo sourceSets.verification
    addModdingDependenciesTo sourceSets.examples
    addModdingDependenciesTo sourceSets.development

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        homecore_validation {
            sourceSet(sourceSets.verification)
        }
        homecore_debug {
            sourceSet(sourceSets.development)
            sourceSet(sourceSets.examples)
        }
    }
    unitTest {
        enable()
        testedMod = mods.homecore
        loadedMods = [mods.homecore]
    }
    runs.client.loadedMods = [mods.homecore]
    runs.server.loadedMods = [mods.homecore]
    runs {
        debugClient {
            client()
            loadedMods = [mods.homecore, mods.homecore_debug]
            gameDirectory = file('run-debug')
        }
        debugServer {
            server()
            loadedMods = [mods.homecore, mods.homecore_debug]
            gameDirectory = file('run-debug-server')
            programArgument '--nogui'
        }
        persistence {
            type = 'gameTestServer'
            loadedMods = [mods.homecore, mods.homecore_validation]
            gameDirectory = file('build/validation/persistence')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'homecore_validation'
            systemProperty 'homecore.persistencePass', providers.gradleProperty('persistencePass').getOrElse('read')
        }
        networkSmoke {
            client()
            loadedMods = [mods.homecore, mods.homecore_validation]
            gameDirectory = file('build/validation/network-client')
            systemProperty 'homecore.networkSmoke', 'true'
        }
        workbenchSmoke {
            client()
            loadedMods = [mods.homecore, mods.homecore_validation]
            gameDirectory = file('build/validation/workbench-client')
            systemProperty 'homecore.networkSmoke', 'true'
            systemProperty 'homecore.workbenchSmoke', 'true'
        }
        debugSmoke {
            client()
            loadedMods = [mods.homecore, mods.homecore_validation, mods.homecore_debug]
            gameDirectory = file('build/validation/debug-client')
            systemProperty 'homecore.networkSmoke', 'true'
            systemProperty 'homecore.debugSmoke', 'true'
        }
        uiSmoke {
            client()
            loadedMods = [mods.homecore, mods.homecore_validation]
            gameDirectory = file('build/validation/ui-client')
            systemProperty 'homecore.uiSmoke', 'true'
            programArguments.addAll('--width', '1280', '--height', '720')
        }
    }
}

// The template is expanded once for both Gradle builds and IDE runs.
def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
        minecraft_version_range: minecraft_version_range,
        neo_version_range      : neo_version_range,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_authors            : mod_authors,
        mod_description        : mod_description,
        jei_version_range      : jei_version_range,
        rei_version_range      : rei_version_range
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

def uiSmokeDir = layout.buildDirectory.dir('validation/ui-client')
def uiSmokeLanguage = providers.gradleProperty('uiSmokeLanguage').getOrElse('en_us')
tasks.named('runUiSmoke') {
    doFirst {
        def options = new File(uiSmokeDir.get().asFile, 'options.txt')
        options.parentFile.mkdirs()
        options.setText('onboardAccessibility:false\npauseOnLostFocus:false\nrenderDistance:2\nsimulationDistance:5\nmaxFps:60\ninactivityFpsLimit:0\ntutorialStep:none\nguiScale:2\nlang:' + uiSmokeLanguage + '\n', 'UTF-8')
    }
    doLast {
        def report = new File(uiSmokeDir.get().asFile, 'logs/latest.log')
        def text = report.exists() ? report.getText('UTF-8') : ''
        if (!text.contains('HOMECORE_UI_SMOKE_OK language=' + uiSmokeLanguage)
                || !text.contains('HOMECORE_UI_VIEWPORT_OK width=640 height=360')
                || !text.contains('HOMECORE_UI_VIEWPORT_OK width=427 height=240')
                || text.contains('HOMECORE_UI_SMOKE_FAILED')) {
            throw new GradleException('UI Kit client verification failed; inspect build/validation/ui-client/logs/latest.log.')
        }
    }
}

def networkSmokeLog = layout.buildDirectory.file('validation/network-client/logs/latest.log')
def networkSmokeOptions = layout.buildDirectory.file('validation/network-client/options.txt')
tasks.named('runNetworkSmoke') {
    doFirst {
        def options = networkSmokeOptions.get().asFile
        if (!options.exists()) {
            options.parentFile.mkdirs()
            options.setText('onboardAccessibility:false\npauseOnLostFocus:false\nrenderDistance:2\nsimulationDistance:5\nmaxFps:60\n', 'UTF-8')
        }
    }
    doLast {
        def report = networkSmokeLog.get().asFile
        def text = report.exists() ? report.getText('UTF-8') : ''
        if (!text.contains('HOMECORE_NETWORK_SMOKE_OK') || !text.contains('HOMECORE_NETWORK_SMOKE_SHUTDOWN_OK')
                || !text.contains('HOMECORE_HOMELINK_MODELS_OK') || text.contains('HOMECORE_NETWORK_SMOKE_FAILED')) {
            throw new GradleException('Connected-client verification failed; inspect the network-client log.')
        }
    }
}

def debugSmokeLog = layout.buildDirectory.file('validation/debug-client/logs/latest.log')
def workbenchSmokeDir = layout.buildDirectory.dir('validation/workbench-client')
def workbenchLanguage = providers.gradleProperty('workbenchLanguage').getOrElse('en_us')
tasks.named('runWorkbenchSmoke') {
    doFirst {
        def options = new File(workbenchSmokeDir.get().asFile, 'options.txt')
        options.parentFile.mkdirs()
        options.setText('onboardAccessibility:false\npauseOnLostFocus:false\nrenderDistance:2\nsimulationDistance:5\nmaxFps:60\ntutorialStep:none\nlang:' + workbenchLanguage + '\n', 'UTF-8')
    }
    doLast {
        def report = new File(workbenchSmokeDir.get().asFile, 'logs/latest.log')
        def text = report.exists() ? report.getText('UTF-8') : ''
        if (!text.contains('HOMECORE_WORKBENCH_SCREEN_OK') || !text.contains('HOMECORE_NETWORK_SMOKE_OK')
                || !text.contains('HOMECORE_HOMELINK_MODELS_OK') || !text.contains('HOMECORE_WORKBENCH_MODELS_OK')
                || text.contains('_SMOKE_FAILED')
                || text.contains('HOMECORE_WORKBENCH_SCREEN_FAILED')) {
            throw new GradleException('Workbench connected-client verification failed; inspect the workbench-client log.')
        }
    }
}

def debugSmokeOptions = layout.buildDirectory.file('validation/debug-client/options.txt')
tasks.named('runDebugSmoke') {
    doFirst {
        def options = debugSmokeOptions.get().asFile
        if (!options.exists()) {
            options.parentFile.mkdirs()
            options.setText('onboardAccessibility:false\npauseOnLostFocus:false\nrenderDistance:2\nsimulationDistance:5\nmaxFps:60\n', 'UTF-8')
        }
    }
    doLast {
        def report = debugSmokeLog.get().asFile
        def text = report.exists() ? report.getText('UTF-8') : ''
        if (!text.contains('HOMECORE_DEBUG_SMOKE_OK') || !text.contains('HOMECORE_NETWORK_SMOKE_SHUTDOWN_OK') || text.contains('HOMECORE_NETWORK_SMOKE_FAILED')) {
            throw new GradleException('Development debug verification failed; inspect the debug-client log.')
        }
    }
}

def persistenceProperties = layout.buildDirectory.file('validation/persistence/server.properties')
tasks.named('runPersistence') {
    doFirst {
        def properties = persistenceProperties.get().asFile
        if (!properties.exists()) {
            properties.parentFile.mkdirs()
            properties.setText('', 'UTF-8')
        }
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = mod_id
            from components.java
            pom {
                name = 'HomeCore'
                description = 'Shared API for connected HomeLink devices.'
                url = 'https://github.com/LKDM7/HomeCore'
                licenses { license { name = 'Apache License, Version 2.0'; url = 'https://www.apache.org/licenses/LICENSE-2.0.txt' } }
                scm { url = 'https://github.com/LKDM7/HomeCore'; connection = 'scm:git:https://github.com/LKDM7/HomeCore.git' }
            }
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/LKDM7/HomeCore')
            credentials {
                username = providers.gradleProperty('githubUser').orElse(providers.environmentVariable('GITHUB_ACTOR')).getOrElse('')
                password = providers.gradleProperty('githubToken').orElse(providers.environmentVariable('GITHUB_TOKEN')).getOrElse('')
            }
        }
        maven {
            name = 'Staging'
            url = layout.buildDirectory.dir('staging-repository')
        }
    }
}

tasks.withType(PublishToMavenRepository).configureEach {
    dependsOn tasks.named('check')
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
