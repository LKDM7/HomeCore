name: Build and tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, unit tests and release archive
        run: bash gradlew build test verifyReleaseJar --no-daemon
      - name: GameTests and persistence write
        run: bash gradlew runPersistence -PpersistencePass=write --no-daemon --no-configuration-cache
      - name: GameTests and persistence read
        run: bash gradlew runPersistence -PpersistencePass=read --no-daemon --no-configuration-cache
      - name: Validate Maven publication
        run: bash gradlew publishMavenJavaPublicationToStagingRepository --no-daemon
      - name: Resolve Maven publication in an independent consumer
        run: bash gradlew -p gradle/publication-smoke verifyPublishedArtifacts --no-daemon --no-configuration-cache
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homecore-validation
          path: |
            build/libs/
            build/reports/
            build/test-results/
            build/validation/persistence/logs/
            build/staging-repository/
